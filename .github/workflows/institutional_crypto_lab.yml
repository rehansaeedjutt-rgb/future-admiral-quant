name: Institutional Crypto Strategy Lab

on:
  workflow_dispatch:

jobs:
  run-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - run: python institutional_crypto_lab.py
