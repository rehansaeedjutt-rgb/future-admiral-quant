name: Future Admiral AI-Quant Auto-Runner

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn python-dotenv openai

      - name: Start Ollama & Pull Lightweight Quant Model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull qwen2.5:3b

      - name: Run Future Admiral AI-Quant Engine
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ACCOUNT_EQUITY: 10000
          MAX_RISK_PER_TRADE: 1.0
        run: python fa_quant_engine.py

      - name: Auto-Update Website Live Stats
        run: |
          git config --global user.name "Future Admiral Bot"
          git config --global user.email "bot@futureadmiral.quant"
          git add reports/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update live quant stats"
            git pull --rebase --autostash origin main
            git push
          fi