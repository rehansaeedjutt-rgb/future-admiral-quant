<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Future Admiral | Institutional AI-Quant Desk</title>
  <style>
    :root { --bg: #070b14; --card: #0f172a; --border: #1e293b; --accent: #00e5a0; --danger: #ff3b69; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 32px 20px; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .brand h1 { font-size: 1.8rem; letter-spacing: 0.5px; }
    .brand span { color: var(--accent); }
    .brand p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .badge { background: rgba(0, 229, 160, 0.12); color: var(--accent); border: 1px solid rgba(0, 229, 160, 0.3); padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; transition: transform 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: #334155; }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .asset { font-size: 1.15rem; font-weight: 700; }
    .price { font-size: 1rem; color: var(--muted); font-weight: 600; }
    .strategy { font-size: 0.85rem; color: var(--accent); background: rgba(0, 229, 160, 0.08); display: inline-block; padding: 4px 10px; border-radius: 6px; margin-bottom: 16px; }
    .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
    .metric { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .metric-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .metric-val { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }
    .pos { color: var(--accent); }
    .neg { color: var(--danger); }
    .verdict { font-size: 0.85rem; color: #cbd5e1; background: rgba(15, 23, 42, 0.8); border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 4px; margin-bottom: 12px; }
    .footer-meta { font-size: 0.75rem; color: var(--muted); display: flex; justify-content: space-between; }
    .cta { margin-top: 40px; text-align: center; padding: 28px; background: linear-gradient(135deg, #0f172a, #111827); border: 1px solid var(--border); border-radius: 14px; }
    .cta h2 { margin-bottom: 8px; }
    .cta p { color: var(--muted); margin-bottom: 16px; }
    .btn { display: inline-block; background: var(--accent); color: #04100b; font-weight: 700; padding: 12px 24px; border-radius: 8px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>⚓ FUTURE <span>ADMIRAL</span></h1>
        <p>Institutional AI-Quant Research & Algorithmic Signal Desk</p>
      </div>
      <div class="badge" id="status-badge">● LIVE 24/7 ENGINE</div>
    </header>

    <div class="grid" id="cards-grid">
      <p style="color:#94a3b8;">Loading live institutional quant data...</p>
    </div>

    <div class="cta">
      <h2>Get Real-Time Discord Alerts</h2>
      <p>Automated ML-filtered signals for Crypto (Binance) & US Equities delivered every 4 hours.</p>
      <a href="#" class="btn">Join Premium Discord Desk</a>
    </div>
  </div>

  <script>
    async function loadStats() {
      try {
        const res = await fetch('reports/live_stats.json?t=' + Date.now());
        const data = await res.json();
        const grid = document.getElementById('cards-grid');
        grid.innerHTML = '';

        data.results.forEach(item => {
          const retClass = item.net_return >= 0 ? 'pos' : 'neg';
          const updated = new Date(item.updated_at).toLocaleString();
          grid.innerHTML += `
            <div class="card">
              <div class="card-top">
                <div class="asset">${item.asset}</div>
                <div class="price">$${item.price.toLocaleString()}</div>
              </div>
              <div class="strategy">${item.strategy}</div>
              <div class="metrics">
                <div class="metric"><div class="metric-label">Net Return</div><div class="metric-val ${retClass}">${item.net_return}%</div></div>
                <div class="metric"><div class="metric-label">Win Rate</div><div class="metric-val">${item.win_rate}%</div></div>
                <div class="metric"><div class="metric-label">Profit Factor</div><div class="metric-val">${item.profit_factor}</div></div>
                <div class="metric"><div class="metric-label">Max Drawdown</div><div class="metric-val neg">-${item.max_drawdown}%</div></div>
              </div>
              <div class="verdict"><strong>AI Verdict:</strong> ${item.ai_verdict}</div>
              <div class="footer-meta">
                <span>Signal: <strong>${item.status}</strong></span>
                <span>${updated}</span>
              </div>
            </div>`;
        });
      } catch (e) {
        document.getElementById('cards-grid').innerHTML = '<p style="color:#ff3b69;">Unable to load live_stats.json yet.</p>';
      }
    }
    loadStats();
  </script>
</body>
</html>
